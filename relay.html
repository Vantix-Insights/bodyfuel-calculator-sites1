<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BodyFuel – Loading your results…</title>
<style>
  body{background:#080810;color:#eeeef5;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px;}
  .spinner{width:36px;height:36px;border:3px solid #252535;border-top-color:#d4f53c;border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:14px;color:#6b6b8a;}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Loading your personal results…</p>
<script>
(function(){
  var raw = new URLSearchParams(window.location.search).get('aff_sub');
  if(!raw){ window.location.replace('thankyou.html'); return; }

  var sub = decodeURIComponent(raw);

  // Fallback path: full params were encoded directly (npoint failed)
  if(sub.indexOf('fb_') === 0){
    var params = decodeURIComponent(sub.slice(3));
    window.location.replace('thankyou.html?' + params);
    return;
  }

  // Normal path: sub is a npoint ID — fetch the stored data
  fetch('https://api.npoint.io/' + sub)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var params = [
        'cal='       + encodeURIComponent(d.cal       || ''),
        'bmi='       + encodeURIComponent(d.bmi       || ''),
        'bmi_label=' + encodeURIComponent(d.bmi_label || ''),
        'bmr='       + encodeURIComponent(d.bmr       || ''),
        'tdee='      + encodeURIComponent(d.tdee      || ''),
        'prot='      + encodeURIComponent(d.prot      || ''),
        'carb='      + encodeURIComponent(d.carb      || ''),
        'fat='       + encodeURIComponent(d.fat       || ''),
        'water='     + encodeURIComponent(d.water     || ''),
        'goal='      + encodeURIComponent(d.goal      || ''),
        'weight='    + encodeURIComponent(d.weight    || ''),
        'unit='      + encodeURIComponent(d.unit      || ''),
        'iw='        + encodeURIComponent(d.iw        || '')
      ].join('&');
      window.location.replace('thankyou.html?' + params);
    })
    .catch(function(){
      window.location.replace('thankyou.html');
    });
})();
</script>
</body>
</html>

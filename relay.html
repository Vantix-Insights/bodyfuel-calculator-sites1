<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BodyFuel – Loading your results…</title>
<style>
  body{background:#080810;color:#eeeef5;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px;}
  .spinner{width:36px;height:36px;border:3px solid #252535;border-top-color:#d4f53c;border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:14px;color:#6b6b8a;}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Loading your personal results…</p>
<script>
// This page is the CPAGrip redirect target.
// It lives on the same origin as index.html so it can read localStorage,
// then immediately forwards to thankyou.html with all values as URL params.
(function(){
  var keys = ['cal','bmi','bmi_label','bmr','tdee','prot','carb','fat','water','goal','weight','unit','iw'];

  // Read data — try cookie first (survives Google Sites iframe restrictions),
  // fall back to localStorage (works in direct-visit / non-iframe scenarios).
  var data = {};
  try{
    var ck = document.cookie.split(';').map(function(c){ return c.trim(); })
              .find(function(c){ return c.startsWith('bf_data='); });
    if(ck) data = JSON.parse(decodeURIComponent(ck.split('=').slice(1).join('=')));
  }catch(e){}
  if(!data.bf_cal){
    try{
      var ls = localStorage.getItem('bf_data');
      if(ls) data = JSON.parse(ls);
    }catch(e){}
  }

  var params = keys.map(function(k){
    return k + '=' + encodeURIComponent(data['bf_' + k] || '');
  }).join('&');

  // Clear both storages so stale values never bleed into a future visitor's session
  try{ document.cookie = 'bf_data=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; }catch(e){}
  try{ localStorage.removeItem('bf_data'); }catch(e){}

  window.location.replace('thankyou.html?' + params);
})();
</script>
</body>
</html>
